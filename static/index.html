<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生物样本库知情同意与撤回 — 样本外借发放单</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 1100px; margin: auto; }
    h1, h2 { color: #111827; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; max-height: 420px; }
    button { padding: .45rem .8rem; cursor: pointer; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    button.danger { background: #dc2626; color: #fff; border-color: #dc2626; }
    button.warn { background: #d97706; color: #fff; border-color: #d97706; }
    .toolbar { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    th, td { border: 1px solid #e5e7eb; padding: .4rem .6rem; text-align: left; }
    th { background: #f9fafb; }
    .status-pending { color: #2563eb; font-weight: 600; }
    .status-receipted { color: #059669; font-weight: 600; }
    .status-frozen { color: #dc2626; font-weight: 600; }
    .status-recalled { color: #d97706; font-weight: 600; }
    .status-returned, .status-destroyed { color: #6b7280; font-weight: 600; }
    .status-conflict { color: #dc2626; font-weight: 600; }
    .status-reconciled { color: #059669; font-weight: 600; }
    .net-ok { color: #059669; font-weight: 700; }
    .net-down { color: #dc2626; font-weight: 700; }
    input, select { padding: .4rem; border: 1px solid #d1d5db; border-radius: 6px; }
    .muted { color: #6b7280; font-size: .85rem; }
  </style>
</head>
<body>
<main>
  <h1>生物样本库知情同意与撤回</h1>
  <p class="muted">样本借给外单位检测后，出库留下待回执的发放单；撤回同意时冻结未回执的发放单并召回，已出结果的实物退回或销毁。回执与本地冻结同时提交时只能有一边成功。</p>

  <div class="card">
    <div class="toolbar">
      <button onclick="checkHealth()">检查服务状态</button>
      <span>网络状态：<span id="netStatus" class="net-ok">正常</span></span>
      <button onclick="setNetwork(true)">恢复网络</button>
      <button class="warn" onclick="setNetwork(false)">模拟断网</button>
    </div>
    <pre id="result">等待操作</pre>
  </div>

  <div class="card">
    <h2>发放单（按状态查看）</h2>
    <div class="toolbar">
      <label>状态过滤：
        <select id="distFilter" onchange="loadDistributions()">
          <option value="">全部</option>
          <option value="pending">待回执</option>
          <option value="receipted">已回执</option>
          <option value="frozen">已冻结</option>
          <option value="recalled">已召回</option>
          <option value="returned">已退回</option>
          <option value="destroyed">已销毁</option>
        </select>
      </label>
      <button onclick="loadDistributions()">刷新</button>
    </div>
    <table id="distTable">
      <thead><tr><th>ID</th><th>样本</th><th>接收机构</th><th>检测用途</th><th>状态</th><th>版本</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h2>新建发放单（出库）</h2>
    <div class="toolbar">
      <input id="d_sample" placeholder="样本 ID" size="14">
      <input id="d_recipient" placeholder="接收机构" size="16">
      <input id="d_purpose" placeholder="检测用途" size="16">
      <input id="d_shipped" placeholder="出库时间(可选)" size="14">
      <button class="primary" onclick="createDistribution()">创建发放单</button>
    </div>
  </div>

  <div class="card">
    <h2>回执（外单位提交）</h2>
    <div class="toolbar">
      <input id="r_dist" placeholder="发放单 ID" size="14">
      <input id="r_no" placeholder="回执单号(可选)" size="14">
      <input id="r_received" placeholder="接收时间(可选)" size="14">
      <input id="r_result" placeholder="检测结果(可选)" size="14">
      <button class="primary" onclick="submitReceipt()">提交回执</button>
      <button onclick="loadReceipts()">刷新回执列表</button>
    </div>
    <table id="receiptTable">
      <thead><tr><th>ID</th><th>发放单</th><th>回执号</th><th>状态</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h2>撤回同意（触发冻结）</h2>
    <div class="toolbar">
      <input id="w_participant" placeholder="参与者 ID" size="14">
      <input id="w_sample" placeholder="样本 ID(逗号分隔)" size="20">
      <input id="w_reason" placeholder="撤回原因" size="16">
      <button class="danger" onclick="withdraw()">审批撤回并冻结</button>
    </div>
    <p class="muted">审批通过后，系统会自动冻结该参与者所有「待回执」的发放单并发起召回。</p>
  </div>
</main>
<script>
const ACTOR = { 'X-User-Id': 'demo-admin', 'X-Role': 'admin' };

async function api(path, opts) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...ACTOR },
    ...opts,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
  return body;
}

function show(data) {
  document.getElementById('result').textContent = JSON.stringify(data, null, 2);
}

function statusClass(s) { return 'status-' + s; }

async function checkHealth() {
  try { show(await api('/health')); } catch (e) { show({ error: e.message }); }
}

async function setNetwork(ok) {
  try {
    const r = await api('/api/network', { method: 'POST', body: JSON.stringify({ ok }) });
    const el = document.getElementById('netStatus');
    el.textContent = r.network_ok ? '正常' : '断网（回执挂起中）';
    el.className = r.network_ok ? 'net-ok' : 'net-down';
    show(r);
  } catch (e) { show({ error: e.message }); }
}

async function loadDistributions() {
  const status = document.getElementById('distFilter').value;
  const q = status ? '?status=' + encodeURIComponent(status) : '';
  try {
    const r = await api('/api/distributions' + q);
    const tbody = document.querySelector('#distTable tbody');
    tbody.innerHTML = '';
    for (const d of r.items) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + d.id + '</td>' +
        '<td>' + (d.data.sample_id || '') + '</td>' +
        '<td>' + (d.data.recipient || '') + '</td>' +
        '<td>' + (d.data.purpose || '') + '</td>' +
        '<td class="' + statusClass(d.status) + '">' + d.status + '</td>' +
        '<td>' + d.version + '</td>' +
        '<td></td>';
      const td = tr.lastElementChild;
      const actions = [
        ['recall', '召回', {}],
        ['return', '退回', { returned_at: new Date().toISOString() }],
        ['destroy', '销毁', { destroyed_at: new Date().toISOString(), reason: '结果已出，销毁实物' }],
      ];
      for (const [action, label, data] of actions) {
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.onclick = async () => {
          try {
            const body = { action, data, expected_version: d.version };
            show(await api('/api/entities/' + d.id + '/actions', { method: 'POST', body: JSON.stringify(body) }));
            loadDistributions();
          } catch (e) { show({ error: e.message }); }
        };
        td.appendChild(btn);
      }
      tbody.appendChild(tr);
    }
  } catch (e) { show({ error: e.message }); }
}

async function createDistribution() {
  const data = {
    sample_id: document.getElementById('d_sample').value,
    recipient: document.getElementById('d_recipient').value,
    purpose: document.getElementById('d_purpose').value,
  };
  const shipped = document.getElementById('d_shipped').value;
  if (shipped) data.shipped_at = shipped;
  try {
    show(await api('/api/distributions', { method: 'POST', body: JSON.stringify(data) }));
    loadDistributions();
  } catch (e) { show({ error: e.message }); }
}

async function submitReceipt() {
  const data = {
    distribution_id: document.getElementById('r_dist').value,
    receipt_no: document.getElementById('r_no').value,
    received_at: document.getElementById('r_received').value || new Date().toISOString(),
    result: document.getElementById('r_result').value,
  };
  try {
    show(await api('/api/receipts', { method: 'POST', body: JSON.stringify(data) }));
    loadReceipts();
    loadDistributions();
  } catch (e) { show({ error: e.message }); }
}

async function loadReceipts() {
  try {
    const r = await api('/api/receipts');
    const tbody = document.querySelector('#receiptTable tbody');
    tbody.innerHTML = '';
    for (const rc of r.items) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + rc.id + '</td>' +
        '<td>' + (rc.data.distribution_id || '') + '</td>' +
        '<td>' + (rc.data.receipt_no || '') + '</td>' +
        '<td class="' + statusClass(rc.status) + '">' + rc.status + '</td>' +
        '<td></td>';
      const td = tr.lastElementChild;
      const btn = document.createElement('button');
      btn.textContent = '重试对账';
      btn.onclick = async () => {
        try {
          show(await api('/api/receipts/' + rc.id + '/retry', { method: 'POST' }));
          loadReceipts();
          loadDistributions();
        } catch (e) { show({ error: e.message }); }
      };
      td.appendChild(btn);
      tbody.appendChild(tr);
    }
  } catch (e) { show({ error: e.message }); }
}

async function withdraw() {
  const participant = document.getElementById('w_participant').value;
  const samples = document.getElementById('w_sample').value.split(',').map(s => s.trim()).filter(Boolean);
  const reason = document.getElementById('w_reason').value;
  try {
    // 先创建撤回申请
    const wd = await api('/api/withdrawals', {
      method: 'POST',
      body: JSON.stringify({ participant_id: participant, requested_at: new Date().toISOString() }),
    });
    // 再审批（触发冻结）
    show(await api('/api/entities/' + wd.id + '/actions', {
      method: 'POST',
      body: JSON.stringify({ action: 'approve', data: { reason, sample_ids: samples } }),
    }));
    loadDistributions();
  } catch (e) { show({ error: e.message }); }
}

loadDistributions();
loadReceipts();
</script>
</body>
</html>
